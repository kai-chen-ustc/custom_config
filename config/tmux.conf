#-- base --#
# choose from emacs or vi
setw -g mode-keys emacs
#setw -g mode-keys vi
#set -g status-keys emacs
#set -g status-keys vi

# Use Ctrl-o for local sessions and Ctrl-b for remote (SSH) sessions
if-shell 'test -n "$SSH_CLIENT"' \
    'set -g prefix ^b' \
    'set -g prefix ^o'

set -g default-terminal "tmux-256color"
set -g display-time 3000
set -g history-limit 65535
# Leave selection and Cmd-C/Cmd-V to the terminal.
set -g mouse off
# set-option -g default-shell /bin/zsh

#-- bindkeys --#

#unbind ^b
bind a send-prefix
# Ctrl-o 是 prefix；按 Ctrl-o Ctrl-o 时把字面量 Ctrl-o 传给 pane。
bind C-o send-prefix
bind O rotate-window

unbind '"'
bind - splitw -v
unbind %
bind | splitw -h

bind k selectp -U
bind j selectp -D
bind h selectp -L
bind l selectp -R

bind ^k resizep -U 10
bind ^j resizep -D 10
bind ^h resizep -L 10
bind ^l resizep -R 10

bind ^u swapp -U
bind ^d swapp -D

bind ^e last
bind q confirm-before -p "Kill pane #P? (y/n)" "kill-pane -t '#{pane_id}'"

bind '~' splitw -h htop
bind ! splitw ncmpcpp
bind m command-prompt "splitw -h 'exec man %%'"
bind v command-prompt "splitw -h 'exec mysdcv %%'"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set-option -g set-titles on
set-option -g set-titles-string '#{=20:session_name}:#I #{?#{==:#{pane_current_command},ssh},#{?@ssh_alias,#{@ssh_alias}:#{s|^[^:]*:||:pane_title},#{pane_title}},#{=40:pane_title}}'
setw -g alternate-screen on
# A remote tmux should pass its active pane title through to an outer tmux.
if-shell 'test -n "$SSH_CLIENT"' \
    'set-option -g set-titles-string "#{pane_title}"'
set -g base-index 1

# Release old global bindings when reloading an existing server.
# Ctrl-Y belongs to the shell; Shift-arrows belong to the active application.
unbind -q -n C-y
unbind -q -n S-Left
unbind -q -n S-Right
unbind -q -n S-Up
unbind -q -n S-Down

# Release the old Alt-arrow bindings, including the prefix forwarding shortcuts.
unbind -q -n M-Left
unbind -q -n M-Right
unbind -q M-Left
unbind -q M-Right
# Switch windows using Alt-[ / Alt-] without prefix.
# If Option inserts symbols instead, enable "Use Option as Meta key" in Terminal.
bind -n M-[ previous-window
bind -n M-] next-window

# trigger copy mode by prefix + [ or prefix + PageUp.
# 不抢 Shift-PageUp，留给 Claude Code fullscreen 等 TUI 自己处理滚动。
unbind -q -n S-PageUp

#-- statusbar --#

#set -g status-left '#[fg=cyan]#H#[fg=green]:#[fg=white]#T#[fg=green]][#[default]'
#set -g status-right '#[fg=green]][ #[fg=blue]%Y-%m-%d #[fg=white]%H:%M#[default]'
#set -g status-right-attr bright

set -g status-bg black
set -g status-fg yellow

# Window status colors (using new tmux syntax)
setw -g window-status-current-style bg=brightblue,fg=black
setw -g window-status-style fg=brightblue

# Pane border colors (using new tmux syntax)
set-option -g pane-active-border-style fg=green,bg=black
set-option -g pane-border-style fg=white,bg=black
    
#set -g status-utf8 on
set -g status-interval 1

#set -g terminal-overrides 'xterm*:smcup@:rmcup@'
#set -g status-justify centre

#set -g visual-activity on
#setw -g monitor-activity on


#-- apps --#

#new -s work mutt
#neww rtorrent
#neww vim
#neww zsh

#selectw -t 3
#set -g status-left "#[fg=red][ #[fg=green]#H #[fg=red]]#[default]"
set -g status-left-length 20
set -g status-right-length 25
#set -g status-right "#[fg=red][ #[fg=green]%H:%M #[fg=magenta]%a %m-%d #[fg=red]]#[default]" 
##setw -g window-status-format '#[fg=blue,bold]#I #T#[default] '
##setw -g window-status-current-format '#[fg=blue,bold,reverse]#I #T#[default] '
#set -g status-utf8 on
#set -g status-justify centre
#set -g status-bg default
set -g status-left "#[fg=cyan]:#[fg=blue]: #[fg=red][ #[fg=colour227]#H #[fg=red]]#[default]"
set -g status-right "#[fg=red][ #[fg=colour154]%H:%M #[fg=colour183]%a %m-%d #[fg=red]] #[fg=blue]:#[fg=cyan]:#[default]"
setw -g window-status-format '#I #{?#{==:#{pane_current_command},ssh},#{?@ssh_alias,#{@ssh_alias}:#{s;^([^:]*:)?(.*/)?;;:pane_title},#{=24:pane_title}},#{=24:window_name}}'
setw -g window-status-current-format '#I #{?#{==:#{pane_current_command},ssh},#{?@ssh_alias,#{@ssh_alias}:#{s;^([^:]*:)?(.*/)?;;:pane_title},#{=24:pane_title}},#{=24:window_name}}'
# Window status alert colors (using new tmux syntax)
setw -g window-status-bell-style bold,reverse,fg=red,bg=default
setw -g window-status-activity-style bold,reverse,fg=yellow,bg=default
